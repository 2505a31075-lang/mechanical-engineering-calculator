{% extends "base.html" %}

{% block content %}
<div class="module-header">
    <h2>4. Fluid Mechanics</h2>
</div>

<div class="tabs">
    <button class="tab-button active" data-tab="pressure">Pressure</button>
    <button class="tab-button" data-tab="reynolds">Reynolds</button>
    <button class="tab-button" data-tab="velocity">Velocity</button>
    <button class="tab-button" data-tab="discharge">Discharge</button>
</div>

<!-- Pressure -->
<div id="pressure" class="tab-content active">
    <h3>Hydrostatic Pressure | P = ρ × g × h</h3>
    <form onsubmit="calculate(event, 'pressure')">
        <label>Fluid Density (kg/m³):</label>
        <input type="number" step="10" placeholder="1000" id="pressure_density" required>
        
        <label>Depth/Height (m):</label>
        <input type="number" step="0.1" placeholder="5" id="pressure_height" required>
        
        <button type="submit">Calculate</button>
    </form>
    <div id="pressure_result" class="result"></div>
</div>

<!-- Reynolds Number -->
<div id="reynolds" class="tab-content">
    <h3>Reynolds Number | Re = (ρ × v × D) / μ</h3>
    <form onsubmit="calculate(event, 'reynolds')">
        <label>Fluid Density (kg/m³):</label>
        <input type="number" step="10" placeholder="1000" id="reynolds_density" required>
        
        <label>Flow Velocity (m/s):</label>
        <input type="number" step="0.1" placeholder="2" id="reynolds_velocity" required>
        
        <label>Pipe Diameter (m):</label>
        <input type="number" step="0.001" placeholder="0.05" id="reynolds_diameter" required>
        
        <label>Dynamic Viscosity (Pa·s):</label>
        <input type="number" step="0.0001" placeholder="0.001" id="reynolds_viscosity" required>
        
        <button type="submit">Calculate</button>
    </form>
    <div id="reynolds_result" class="result"></div>
</div>

<!-- Flow Velocity -->
<div id="velocity" class="tab-content">
    <h3>Flow Velocity | v = Q / A</h3>
    <form onsubmit="calculate(event, 'velocity')">
        <label>Volumetric Flow Rate (m³/s):</label>
        <input type="number" step="0.01" placeholder="0.1" id="velocity_flow" required>
        
        <label>Cross-sectional Area (m²):</label>
        <input type="number" step="0.001" placeholder="0.05" id="velocity_area" required>
        
        <button type="submit">Calculate</button>
    </form>
    <div id="velocity_result" class="result"></div>
</div>

<!-- Discharge -->
<div id="discharge" class="tab-content">
    <h3>Discharge | Q = A × v</h3>
    <form onsubmit="calculate(event, 'discharge')">
        <label>Cross-sectional Area (m²):</label>
        <input type="number" step="0.001" placeholder="0.05" id="discharge_area" required>
        
        <label>Flow Velocity (m/s):</label>
        <input type="number" step="0.1" placeholder="2" id="discharge_velocity" required>
        
        <button type="submit">Calculate</button>
    </form>
    <div id="discharge_result" class="result"></div>
</div>

<script>
function calculate(event, action) {
    event.preventDefault();
    
    let data = { action: action };
    
    if (action === 'pressure') {
        data.density = document.getElementById('pressure_density').value;
        data.height = document.getElementById('pressure_height').value;
    } else if (action === 'reynolds') {
        data.density = document.getElementById('reynolds_density').value;
        data.velocity = document.getElementById('reynolds_velocity').value;
        data.diameter = document.getElementById('reynolds_diameter').value;
        data.viscosity = document.getElementById('reynolds_viscosity').value;
    } else if (action === 'velocity') {
        data.flow_rate = document.getElementById('velocity_flow').value;
        data.area = document.getElementById('velocity_area').value;
    } else if (action === 'discharge') {
        data.area = document.getElementById('discharge_area').value;
        data.velocity = document.getElementById('discharge_velocity').value;
    }
    
    fetch('{{ url_for("fluid") }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        let resultDiv = document.getElementById(action + '_result');
        if (result.error) {
            resultDiv.innerHTML = `<p class="error">❌ Error: ${result.error}</p>`;
            resultDiv.className = 'result error';
        } else {
            let output = '';
            for (let key in result) {
                output += `<p><strong>${key}:</strong> ${result[key]}</p>`;
            }
            resultDiv.innerHTML = output;
            resultDiv.className = 'result success';
        }
    });
}

document.querySelectorAll('.tab-button').forEach(button => {
    button.addEventListener('click', function() {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(this.dataset.tab).classList.add('active');
        this.classList.add('active');
    });
});
</script>
{% endblock %}
