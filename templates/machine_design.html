{% extends "base.html" %}

{% block content %}
<div class="module-header">
    <h2>6. Machine Design</h2>
</div>

<div class="tabs">
    <button class="tab-button active" data-tab="torque">Torque</button>
    <button class="tab-button" data-tab="power">Shaft Power</button>
    <button class="tab-button" data-tab="diameter">Shaft Diameter</button>
</div>

<!-- Torque -->
<div id="torque" class="tab-content active">
    <h3>Torque | T = F × r</h3>
    <form onsubmit="calculate(event, 'torque')">
        <label>Applied Force (N):</label>
        <input type="number" step="1" placeholder="100" id="torque_force" required>
        
        <label>Radius / Lever Arm (m):</label>
        <input type="number" step="0.01" placeholder="0.5" id="torque_radius" required>
        
        <button type="submit">Calculate</button>
    </form>
    <div id="torque_result" class="result"></div>
</div>

<!-- Shaft Power -->
<div id="power" class="tab-content">
    <h3>Shaft Power | P = (2π × N × T) / 60</h3>
    <form onsubmit="calculate(event, 'power')">
        <label>Rotational Speed (RPM):</label>
        <input type="number" step="10" placeholder="1500" id="power_speed" required>
        
        <label>Torque (N·m):</label>
        <input type="number" step="1" placeholder="20" id="power_torque" required>
        
        <button type="submit">Calculate</button>
    </form>
    <div id="power_result" class="result"></div>
</div>

<!-- Shaft Diameter -->
<div id="diameter" class="tab-content">
    <h3>Shaft Diameter | d = ∛(16T / (π·τ_allow))</h3>
    <form onsubmit="calculate(event, 'diameter')">
        <label>Torque to Transmit (N·m):</label>
        <input type="number" step="1" placeholder="150" id="diameter_torque" required>
        
        <label>Allowable Shear Stress (Pa):</label>
        <input type="number" step="1000000" placeholder="40000000" id="diameter_stress" required>
        
        <button type="submit">Calculate</button>
    </form>
    <div id="diameter_result" class="result"></div>
</div>

<script>
function calculate(event, action) {
    event.preventDefault();
    
    let data = { action: action };
    
    if (action === 'torque') {
        data.force = document.getElementById('torque_force').value;
        data.radius = document.getElementById('torque_radius').value;
    } else if (action === 'power') {
        data.speed = document.getElementById('power_speed').value;
        data.torque = document.getElementById('power_torque').value;
    } else if (action === 'diameter') {
        data.torque = document.getElementById('diameter_torque').value;
        data.shear_stress = document.getElementById('diameter_stress').value;
    }
    
    fetch('{{ url_for("machine_design") }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        let resultDiv = document.getElementById(action + '_result');
        if (result.error) {
            resultDiv.innerHTML = `<p class="error">❌ Error: ${result.error}</p>`;
            resultDiv.className = 'result error';
        } else {
            let output = '';
            for (let key in result) {
                output += `<p><strong>${key}:</strong> ${result[key]}</p>`;
            }
            resultDiv.innerHTML = output;
            resultDiv.className = 'result success';
        }
    });
}

document.querySelectorAll('.tab-button').forEach(button => {
    button.addEventListener('click', function() {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(this.dataset.tab).classList.add('active');
        this.classList.add('active');
    });
});
</script>
{% endblock %}
